version: '3.8'

services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: webapi_postgresql_v1
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConncetionStrings__DefaultConnection=Host=postgreserver;username=postgres;password=Mascote2004.;database=HouseDB;TrustServerCertificate=true;
    depends_on:
      - postgreserver

  postgreserver:
    image: postgres:latest
    environment:
      POSTGRES_DB: HouseDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mascote2004.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  default:
    name: my_custom_Network

volumes:
  pgdata:
